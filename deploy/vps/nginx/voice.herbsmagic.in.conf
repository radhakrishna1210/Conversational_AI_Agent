# nginx site for voice.herbsmagic.in  →  127.0.0.1:4300
#
# Install:
#   cp deploy/vps/nginx/voice.herbsmagic.in.conf /etc/nginx/sites-available/voice.herbsmagic.in
#   ln -s /etc/nginx/sites-available/voice.herbsmagic.in /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d voice.herbsmagic.in     # injects the ssl/443 lines below
#
# PORT 4300 IS NOT ARBITRARY. This box already has 4000 (blog-backend),
# 3000/3001/3100/3200 (next-server x4), 5000, 5100 (mannmate-backend),
# 8000/8001 (gunicorn), 6379 (redis), 9100 (prometheus-node) and 27017 (mongod)
# bound. 4300 was free. It must match PORT in shared/.env and nothing else.
#
# NOTE ON `map`: this file deliberately does NOT declare a
# `map $http_upgrade $connection_upgrade` block. That directive is http-context
# only, and mannmate.com / blogs.mannmate.com already handle upgrades on this
# nginx — a second identically-named map would be a duplicate-definition error
# that takes down ALL FIVE existing sites on the next reload. The WebSocket
# locations below hardcode `Connection "upgrade"` instead, which is safe because
# those paths are WebSocket-only.

server {
    listen 80;
    listen [::]:80;
    server_name voice.herbsmagic.in;

    # certbot --nginx rewrites this block to a 301 → https and adds the 443
    # server below. Left plain so the initial HTTP-01 challenge can succeed.

    # KB file uploads. MAX_FILE_SIZE_MB=10 in .env; the extra 2m covers
    # multipart overhead. nginx's 1m default would reject uploads with a 413
    # before the request ever reached Express.
    client_max_body_size 12m;

    # ── Live voice WebSockets ────────────────────────────────────────────────
    # Matches server.js:76-78:
    #   /api/v1/workspaces/:workspaceId/agents/:agentId/xai-call   (bundled)
    #   /api/v1/workspaces/:workspaceId/agents/:agentId/web-call   (modular)
    location ~ ^/api/v1/workspaces/[^/]+/agents/[^/]+/(xai-call|web-call)$ {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A voice call holds this socket open for the whole conversation.
        # nginx's 60s default would drop every call at the one-minute mark —
        # the classic "calls always die at exactly 60 seconds" bug.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Audio frames must reach the browser as they are produced. Buffering
        # would batch them and destroy the latency work in the voice pipeline.
        proxy_buffering off;
    }

    # ── Twilio Media Streams ─────────────────────────────────────────────────
    # server.js:80 — /api/v1/twilio-media/:workspaceId/:agentId
    # This is the origin PUBLIC_BACKEND_WS_URL points at (wss://voice.herbsmagic.in).
    # If this block is wrong, inbound phone calls silently degrade to
    # greeting-only instead of failing loudly.
    location ^~ /api/v1/twilio-media/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # ── API + SPA ────────────────────────────────────────────────────────────
    # One location for everything else: this process serves the built React app
    # as well as the API (app.js:97), which is required — the client opens its
    # call socket against window.location.host and fetches relative /api/v1
    # paths, so the page and the API must share an origin.
    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Off for the SSE notification stream (app.js keepalive every 30s).
        # With buffering on, nginx holds events until its buffer fills and the
        # UI appears frozen.
        proxy_buffering off;

        # Generous but finite: covers slow LLM/TTS provider round-trips on
        # non-streaming endpoints without leaking sockets forever.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Razorpay and Twilio webhooks POST here. No special block needed — the
    # signature is verified over the raw body inside Express (app.js:65-72) and
    # nginx does not alter request bodies. Do NOT add sub_filter or gzip on
    # requests here; either would invalidate the HMAC.
}
