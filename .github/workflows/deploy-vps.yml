# Continuous deployment → Hostinger VPS (62.72.12.185), voice.herbsmagic.in
#
# The React build runs HERE, not on the VPS. That box has 2 vCPUs, ~4.3GB free
# and 17 PM2 processes (three of them already in restart loops); `tsc && vite
# build` over this dependency tree peaks past 2GB, and an OOM kill there would
# take down a neighbouring production app, not just this one.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST      62.72.12.185
#   VPS_USER      root
#   VPS_SSH_KEY   private half of a keypair whose public half is in
#                 /root/.ssh/authorized_keys on the VPS
#   VPS_PORT      22  (optional, defaults to 22)

name: Deploy to VPS

on:
  push:
    branches: [main]
  # Manual re-deploy without an empty commit — useful when only an env var on
  # the server changed.
  workflow_dispatch:

# A second push while a deploy is mid-flight would race on `git reset --hard`
# and `prisma migrate deploy` on the server. Queue instead of cancelling: an
# interrupted deploy can leave migrations applied but PM2 not reloaded.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the VPS runtime (nvm v20.10.0) so a build that passes here
          # cannot fail there on a version difference.
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Build client
        working-directory: client
        # No VITE_* variables are needed: the only build-time reference is
        # VITE_API_URL (src/pages/ReportIssue.tsx:3) and it defaults to the
        # relative "/api/v1", which is correct for this single-origin deploy.
        run: npm run build

      - name: Verify build output
        working-directory: client
        # Cheap guard against shipping an empty directory. Without index.html
        # the server logs "No client build" and serves JSON 404s for every page.
        run: test -f dist/index.html || { echo "::error::client/dist/index.html missing"; exit 1; }

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the host key on first contact. ssh-keyscan alone is
          # trust-on-first-use, which is weak, but it is strictly better than
          # StrictHostKeyChecking=no — it at least detects a key change between
          # runs. Replace with a committed known_hosts entry if you want this
          # airtight.
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload client build
        # Staged into .deploy-incoming rather than straight into client/dist,
        # because deploy.sh runs `git reset --hard` immediately after this and
        # the swap into place must happen on the far side of that reset.
        # --delete so a file removed from the build is removed on the server.
        run: |
          # The VPS runs rsync 3.1.3 (Ubuntu 20.04), which predates --mkpath and
          # will not create missing parent directories on the remote side.
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'mkdir -p /root/apps/convai-voice/.deploy-incoming/dist'
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ secrets.VPS_PORT || 22 }}" \
            client/dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/apps/convai-voice/.deploy-incoming/dist/"

      - name: Run deploy script
        # deploy.sh pulls code, installs backend deps, runs migrations, swaps in
        # the build above, reloads ONLY convai-voice-api, and health-checks. It
        # exits non-zero (failing this job) if /health does not answer in 30s.
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'bash /root/apps/convai-voice/repo/deploy/vps/deploy.sh'

      - name: Verify public endpoint
        # Confirms the whole chain — DNS, nginx, TLS, proxy_pass — not just the
        # loopback health check deploy.sh already did.
        run: |
          curl -fsS --max-time 15 https://voice.herbsmagic.in/health

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
