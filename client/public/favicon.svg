<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Spandan">
  <!--
    The Spandan pulse mark. Mirrors components/SpandanLogo.tsx: a hairline ring
    with a glowing core. Drawn on the dark canvas (#080d18) rather than a teal
    tile so the favicon matches the app's own surface in a dark browser chrome.
  -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0cd4bc"/>
      <stop offset="1" stop-color="#0eb39e"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#080d18"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#0eb39e" stroke-width="3" opacity="0.85"/>
  <circle cx="32" cy="32" r="6.5" fill="url(#core)" filter="url(#glow)"/>
</svg>
